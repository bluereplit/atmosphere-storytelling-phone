kind = "mobile"
previewPath = "/atmosphere-phone/"
title = "Atmosphere Phone"
version = "1.0.0"
id = "artifacts/atmosphere-phone"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/atmosphere-phone/" ]
localPort = 23515

[services.development]
run = "pnpm --filter @workspace/atmosphere-phone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/atmosphere-phone", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/atmosphere-phone", "run", "serve" ]

[services.env]
PORT = "23515"
BASE_PATH = "/atmosphere-phone/"
